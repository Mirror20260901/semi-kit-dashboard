<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半品齐套管理看板</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a73e8;--primary-light:#4a9af5;--primary-dark:#0d47a1;
  --bg:#f0f4f8;--card:#fff;--text:#1a2332;--text-secondary:#5a6a7e;
  --border:#dce3ed;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --shadow:0 2px 12px rgba(26,115,232,.08);--radius:12px;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--primary);text-decoration:none}

/* Header */
.header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:16px 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.15)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;font-weight:700;letter-spacing:.5px}
.header-actions{display:flex;gap:8px;align-items:center}

/* Tabs */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.15);border-radius:8px;padding:3px}
.tab-btn{padding:8px 20px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px;font-size:.9rem;font-weight:500;transition:all .2s}
.tab-btn.active{background:#fff;color:var(--primary-dark);font-weight:600}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

/* Main */
main{max-width:1400px;margin:0 auto;padding:20px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-size:1.1rem;font-weight:600;color:var(--text)}
.card-body{padding:20px}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);border-left:4px solid var(--primary)}
.kpi-card.success{border-left-color:var(--success)}
.kpi-card.warning{border-left-color:var(--warning)}
.kpi-card.danger{border-left-color:var(--danger)}
.kpi-label{font-size:.85rem;color:var(--text-secondary);margin-bottom:4px}
.kpi-value{font-size:2rem;font-weight:700;color:var(--text);line-height:1.2}
.kpi-sub{font-size:.8rem;color:var(--text-secondary);margin-top:4px}

/* Scan Page */
.scan-input-area{text-align:center;padding:30px 20px}
.scan-input-wrap{position:relative;max-width:600px;margin:0 auto 20px}
#scanInput{width:100%;padding:16px 20px;font-size:1.3rem;border:2px solid var(--primary);border-radius:12px;outline:none;transition:all .3s;background:#f8faff}
#scanInput:focus{border-color:var(--primary-light);box-shadow:0 0 0 4px rgba(26,115,232,.15);background:#fff}
#scanInput.success{border-color:var(--success);background:#f0fdf4}
#scanInput.duplicate{border-color:var(--danger);background:#fef2f2}
#scanInput.error{border-color:var(--danger);background:#fef2f2}
#cameraBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;background:var(--primary);color:#fff;border-radius:10px;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 8px rgba(26,115,232,.3)}
#cameraBtn:hover{background:var(--primary-dark)}
.scan-status{margin-top:12px;font-size:1rem;font-weight:500;min-height:28px;transition:all .3s}
.scan-status.ok{color:var(--success)}
.scan-status.err{color:var(--danger)}

/* Camera Modal */
#cameraModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:1000;justify-content:center;align-items:center;flex-direction:column;padding:16px}
#cameraModal.show{display:flex}
.camera-container{width:92%;max-width:480px;aspect-ratio:1;background:#000;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#reader{width:100%!important;height:100%!important}
#reader video{width:100%!important;height:100%!important;object-fit:cover;border-radius:16px}
#reader__scan-region{border-radius:16px!important}
#reader__dashboard{display:none!important}
.camera-top-bar{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent)}
.camera-close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:1.2rem;cursor:pointer;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.camera-status{color:#fff;font-size:.85rem;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:20px;backdrop-filter:blur(4px)}
.camera-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:rgba(34,197,94,.3);pointer-events:none;animation:cameraFlash .6s ease-out forwards}
@keyframes cameraFlash{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}

.action-select{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.action-btn{padding:10px 28px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:1rem;font-weight:500;transition:all .2s}
.action-btn.active-in{border-color:var(--success);background:#f0fdf4;color:#166534}
.action-btn.active-out{border-color:var(--danger);background:#fef2f2;color:#991b1b}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#f5f8fc;padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#f8faff}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}

/* Expandable rows */
.expand-row{cursor:pointer;user-select:none}
.expand-row td:first-child::before{content:'▶';display:inline-block;margin-right:6px;font-size:.7rem;transition:transform .2s;color:var(--primary)}
.expand-row.open td:first-child::before{transform:rotate(90deg)}
.detail-row{display:none}
.detail-row.show{display:table-row}
.detail-row td{background:#f8faff;padding:8px 12px 8px 36px}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 16px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--primary)}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:#f0f6ff}
.btn-sm{padding:6px 14px;font-size:.82rem}

/* Chart area */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
@media(max-width:768px){.chart-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px}
.chart-card h2{font-size:1rem;font-weight:600;margin-bottom:16px;color:var(--text)}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-item{display:flex;align-items:center;gap:8px}
.bar-label{width:120px;font-size:.78rem;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#e8eef6;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease;min-width:2px}
.bar-value{font-size:.78rem;font-weight:600;width:40px;text-align:right;flex-shrink:0}

/* Recent scan list */
.recent-list{max-width:700px;margin:0 auto}
.recent-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);font-size:.88rem}
.recent-item:last-child{border-bottom:none}
.recent-time{color:var(--text-secondary);font-size:.8rem}
.recent-code{font-family:"SF Mono",Monaco,Consolas,monospace;font-size:.82rem;color:var(--primary-dark)}

/* Mobile */
@media(max-width:640px){
  .header-inner{flex-direction:column;align-items:flex-start}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-value{font-size:1.5rem}
  #scanInput{font-size:1.1rem;padding:14px 16px}
  main{padding:12px}
  .bar-label{width:80px;font-size:.72rem}
  .search-bar{flex-direction:column}
}

/* Shake animation for duplicate alert */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

/* Focus */
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* Reduced motion */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Print */
@media print{
  .header,.scan-input-area,.search-bar,.action-select,.tabs{display:none!important}
  .tab-panel{display:block!important}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
}

/* Tooltip */
.info-tip{display:inline-block;width:16px;height:16px;background:var(--primary);color:#fff;border-radius:50%;text-align:center;line-height:16px;font-size:.7rem;cursor:help;margin-left:4px}

/* Notification toast */
.toast{position:fixed;top:80px;right:20px;padding:12px 24px;border-radius:8px;color:#fff;font-weight:500;z-index:999;transform:translateX(120%);transition:transform .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{transform:translateX(0)}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--primary)}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1>📦 半品齐套管理看板</h1>
    <div class="header-actions">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('scan')">扫码录入</button>
        <button class="tab-btn" onclick="switchTab('dashboard')">齐套看板</button>
      </div>

    </div>
  </div>
</header>

<main>
  <!-- Tab 1: Scan -->
  <div id="tab-scan" class="tab-panel active">
    <!-- BOM Load Section -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-body" style="padding:16px 20px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:.9rem">📂 加载 BOM 清单 CSV</span>
          <input type="file" accept=".csv" onchange="loadBOMCSV(event)" style="font-size:.85rem">
          <span style="font-size:.8rem;color:var(--text-secondary)" id="bomLoadStatus">半品库存已内置，加载BOM可更新成品列表</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body scan-input-area">
        <div class="action-select">
          <button class="action-btn active-in" id="btnIn" onclick="setAction('入库')">📥 入库</button>
          <button class="action-btn" id="btnOut" onclick="setAction('出库')">📤 出库</button>
        </div>
        <div class="scan-input-wrap">
          <input type="text" id="scanInput" placeholder="请扫描唯一码（扫码枪或点📷相机扫码）" autofocus autocomplete="off">
          <button id="cameraBtn" onclick="openCamera()" title="手机摄像头扫码">📷</button>
        </div>
        <div class="scan-status" id="scanStatus"></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <h2>📋 扫码记录</h2>
        <button class="btn btn-outline btn-sm" onclick="exportScanCSV()">💾 导出 CSV</button>
      </div>
      <div class="card-body">
        <!-- Search and filter controls -->
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
          <input type="text" id="scanSearchInput" placeholder="搜索唯一码或料号..." style="flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.9rem">
          <input type="date" id="scanDateFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.9rem">
          <button class="btn btn-primary btn-sm" onclick="filterScanRecords()">🔍 查询</button>
          <button class="btn btn-outline btn-sm" onclick="clearScanFilter()">🔄 显示全部</button>
          <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="deleteByDate()">🗑️ 删除该日期</button>
        </div>
        <div id="scanRecordCount" style="font-size:.8rem;color:var(--text-secondary);margin-bottom:8px">共 0 条记录</div>
        <div class="recent-list" id="recentList" style="max-height:400px;overflow-y:auto">
          <div style="padding:20px;text-align:center;color:var(--text-secondary)">暂无扫码记录</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: Dashboard -->
  <div id="tab-dashboard" class="tab-panel">
    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="kpi-label">总成品数</div><div class="kpi-value" id="kpiTotal">57</div></div>
      <div class="kpi-card success"><div class="kpi-label">可齐套成品数</div><div class="kpi-value" id="kpiKit">0</div></div>
      <div class="kpi-card"><div class="kpi-label">当前库存</div><div class="kpi-value" id="kpiSemiTotal">0</div></div>
    </div>

    <!-- Detail Table -->
    <div class="card">
      <div class="card-header">
        <h2>📊 成品齐套明细</h2>
      </div>
      <div class="card-body">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索成品料号..." oninput="filterTable()">
          <button class="btn btn-outline btn-sm" onclick="sortTable()">🔄 按可配套数排序</button>
          <button class="btn btn-outline btn-sm" onclick="expandAll()">📂 全部展开</button>
          <button class="btn btn-outline btn-sm" onclick="collapseAll()">📁 全部收起</button>
          <button class="btn btn-primary btn-sm" onclick="exportToExcel()">📥 导出Excel</button>
        </div>
        <div class="table-wrap">
          <table id="dashTable">
            <thead>
              <tr>
                <th>成品料号</th>
                <th>半品数</th>
                <th>可配套数</th>
                <th>齐套状态</th>
                <th>缺料半品</th>
                <th>最大缺口</th>
              </tr>
            </thead>
            <tbody id="dashBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="chart-grid">
      <div class="chart-card">
        <h2>📊 可配套数分布</h2>
        <div class="bar-chart" id="chartKit"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>

// ====== SCAN HANDLING ======
const scanInput = document.getElementById('scanInput');
const scanStatus = document.getElementById('scanStatus');

scanInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    processScan(this.value.trim());
  }
});

function processScan(code) {
  if (!code) return;
  
  // 格式校验
  const errMsg = validateScanCode(code);
  if (errMsg) {
    scanInput.className = 'error';
    scanStatus.textContent = '❌ ' + errMsg;
    scanStatus.className = 'scan-status err';
    scanStatus.style.fontWeight = 'bold';
    scanStatus.style.fontSize = '1.1rem';
    playSound('error');
    showToast(errMsg, 'error');
    scanInput.style.animation = 'shake 0.5s ease-in-out';
    setTimeout(() => { scanInput.style.animation = ''; }, 500);
    setTimeout(() => {
      scanInput.className = '';
      scanInput.value = '';
      scanInput.focus();
    }, 1500);
    return;
  }
  
  // Parse the unique code: WP-{半品料号}-{date}-{seq}
  // Extract half-part number from the code
  let halfPart = extractHalfPart(code);
  
  // Check duplicate
  const isDup = scanRecords.some(r => r.c === code && r.a === currentAction);
  
  // Create record
  const now = new Date();
  const timeStr = now.getFullYear() + '-' + 
    String(now.getMonth()+1).padStart(2,'0') + '-' + 
    String(now.getDate()).padStart(2,'0') + ' ' + 
    String(now.getHours()).padStart(2,'0') + ':' + 
    String(now.getMinutes()).padStart(2,'0');
  
  const record = {
    t: timeStr,
    c: code,
    x: halfPart || '',
    r: '',
    d: '',
    w: '',
    a: currentAction
  };
  
  if (isDup) {
    scanInput.className = 'duplicate';
    scanStatus.textContent = '🚨 重复扫码警报！该唯一码已' + currentAction + '过！';
    scanStatus.className = 'scan-status err';
    scanStatus.style.fontWeight = 'bold';
    scanStatus.style.fontSize = '1.1rem';
    playSound('duplicate');
    showToast('🚨 重复扫码警报！', 'error');
    
    // 闪烁效果
    scanInput.style.animation = 'shake 0.5s ease-in-out';
    setTimeout(() => { scanInput.style.animation = ''; }, 500);
  } else {
    scanRecords.unshift(record);
    
    // Update inventory
    if (halfPart && halfPart in inventory) {
      if (currentAction === '入库') inventory[halfPart]++;
      else if (currentAction === '出库') inventory[halfPart] = Math.max(0, inventory[halfPart] - 1);
    }
    
    scanInput.className = 'success';
    scanStatus.textContent = '✅ ' + currentAction + '成功！' + (halfPart ? ' 半品：' + halfPart : '') + ' 当前库存：' + (inventory[halfPart] || 0);
    scanStatus.className = 'scan-status ok';
    playSound('success');
    showToast(currentAction + '成功', 'success');
    
    renderRecentList();
    recalculate();
  }
  
  setTimeout(() => {
    scanInput.className = '';
    scanInput.value = '';
    scanInput.focus();
  }, 1500);
}

function extractHalfPart(code) {
  // Format: WP-{成品}-{Pxx}-{Pyz}-{date}-{seq}
  // Or: WP-{半品料号}-{date}-{seq}
  if (!code.startsWith('WP-')) return '';
  const parts = code.split('-');
  // Try to find the half-part: everything between WP- and the date pattern
  // WP-8180922863-P1A4-P5-260904-000012
  // Half part = 8180922863-P1A4-P5
  if (parts.length >= 5) {
    // Find where date starts (6-digit number)
    for (let i = 2; i < parts.length; i++) {
      if (/^\d{6}$/.test(parts[i])) {
        return parts.slice(1, i).join('-');
      }
    }
    // Fallback: take parts 1 to length-2
    return parts.slice(1, -2).join('-');
  }
  return '';
}

function validateScanCode(code) {
  if (!code || !code.startsWith('WP-')) return '唯一码必须以WP-开头';
  // 末尾必须是 6位日期-6位序号
  if (!/-\d{6}-\d{6}$/.test(code)) return '唯一码格式错误，末尾应为 日期(6位)-序号(6位)';
  // 至少5段：WP-半品-日期-序号 或更多
  const parts = code.split('-');
  if (parts.length < 4) return '唯一码段数不足，缺少短横线分隔';
  // 解析出的半品料号必须存在于库存中
  const halfPart = extractHalfPart(code);
  if (!halfPart || !(halfPart in inventory)) return '未识别的半品料号：' + (halfPart || '无法解析') + '，请检查码格式';
  return '';
}

// ====== SOUND EFFECTS ======
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if (type === 'success') {
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'duplicate') {
      // 重复扫码报警：急促的三声警报
      osc.type = 'square';
      const alarmInterval = 0.15;
      for (let i = 0; i < 3; i++) {
        const startTime = ctx.currentTime + i * alarmInterval * 2;
        osc.frequency.setValueAtTime(1000, startTime);
        osc.frequency.setValueAtTime(600, startTime + alarmInterval);
      }
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.9);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.9);
    } else {
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}

// ====== RECENT LIST ======
let filteredScanRecords = []; // 当前过滤后的记录（用于显示）

function renderRecentList() {
  const el = document.getElementById('recentList');
  const countEl = document.getElementById('scanRecordCount');
  const records = filteredScanRecords.length > 0 ? filteredScanRecords : scanRecords.filter(r => r.c);
  
  countEl.textContent = `共 ${records.length} 条记录` + (filteredScanRecords.length > 0 ? '（已筛选）' : '');
  
  if (records.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary)">暂无扫码记录</div>';
    return;
  }
  
  el.innerHTML = records.map((r, idx) => {
    const realIdx = scanRecords.indexOf(r);
    return `
    <div class="recent-item" style="display:flex;align-items:center;gap:8px">
      <span class="recent-time" style="min-width:120px">${r.t}</span>
      <span class="recent-code" style="flex:1;font-size:.75rem;word-break:break-all">${r.c}</span>
      <span style="min-width:80px">${r.x || '-'}</span>
      <span class="badge ${r.a === '入库' ? 'badge-green' : 'badge-red'}" style="min-width:45px;text-align:center">${r.a}</span>
      <button class="btn btn-sm" style="padding:4px 8px;background:var(--danger);color:#fff;font-size:.75rem" onclick="deleteSingleRecord(${realIdx})" title="删除此记录">🗑️</button>
    </div>
  `}).join('');
}

// ====== FILTER SCAN RECORDS ======
function filterScanRecords() {
  const keyword = document.getElementById('scanSearchInput').value.trim().toLowerCase();
  const dateFilter = document.getElementById('scanDateFilter').value;
  
  filteredScanRecords = scanRecords.filter(r => {
    let match = true;
    if (keyword) {
      match = match && (r.c.toLowerCase().includes(keyword) || (r.x && r.x.toLowerCase().includes(keyword)));
    }
    if (dateFilter) {
      const recordDate = r.t.split(' ')[0];
      match = match && recordDate === dateFilter;
    }
    return match && r.c;
  });
  
  renderRecentList();
}

function clearScanFilter() {
  document.getElementById('scanSearchInput').value = '';
  document.getElementById('scanDateFilter').value = '';
  filteredScanRecords = [];
  renderRecentList();
}

// ====== DELETE SCAN RECORD ======
function deleteSingleRecord(index) {
  if (index < 0 || index >= scanRecords.length) return;
  
  const record = scanRecords[index];
  if (!confirm(`确定要删除这条记录吗？\n\n唯一码：${record.c}\n时间：${record.t}\n动作：${record.a}\n\n删除后将同步更新库存和齐套数据。`)) return;
  
  // Reverse the inventory change
  const hp = extractHalfPart(record.c);
  if (hp && hp in inventory) {
    if (record.a === '入库') inventory[hp] = Math.max(0, inventory[hp] - 1);
    else if (record.a === '出库') inventory[hp]++;
  }
  
  // Remove record
  scanRecords.splice(index, 1);
  
  // Clear filter and refresh
  filteredScanRecords = [];
  renderRecentList();
  recalculate();
  showToast('记录已删除', 'success');
}

function deleteByDate() {
  const dateFilter = document.getElementById('scanDateFilter').value;
  if (!dateFilter) {
    showToast('请先选择要删除的日期', 'error');
    return;
  }
  
  const recordsToDelete = scanRecords.filter(r => r.t.startsWith(dateFilter));
  if (recordsToDelete.length === 0) {
    showToast('该日期没有扫码记录', 'info');
    return;
  }
  
  if (!confirm(`确定要删除 ${dateFilter} 的所有扫码记录吗？\n\n共 ${recordsToDelete.length} 条记录\n\n删除后将同步更新库存和齐套数据。`)) return;
  
  // Reverse inventory changes
  recordsToDelete.forEach(record => {
    const hp = extractHalfPart(record.c);
    if (hp && hp in inventory) {
      if (record.a === '入库') inventory[hp] = Math.max(0, inventory[hp] - 1);
      else if (record.a === '出库') inventory[hp]++;
    }
  });
  
  // Remove records
  scanRecords = scanRecords.filter(r => !r.t.startsWith(dateFilter));
  
  // Clear filter and refresh
  filteredScanRecords = [];
  document.getElementById('scanDateFilter').value = '';
  renderRecentList();
  recalculate();
  showToast(`已删除 ${recordsToDelete.length} 条记录`, 'success');
}

// ====== CSV EXPORT ======
function exportScanCSV() {
  if (scanRecords.length === 0) { showToast('暂无数据可导出', 'info'); return; }
  let csv = '\uFEFF时间,唯一码,线序料号,操作人,关联单号,库位,批次,动作\n';
  scanRecords.forEach(r => {
    csv += `"${r.t}","${r.c}","${r.x}","${r.r}","${r.d}","${r.w}","${r.a}"\n`.replace(/,"",/g, ',"",').replace(/"undefined"/g, '""');
  });
  // Clean up undefined
  csv = csv.replace(/undefined/g, '');
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '扫码记录_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已导出', 'success');
}

// ====== CSV IMPORT ======
function loadBOMCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split('\n');
    let headerSkipped = false;
    bomData = {};
    productList = [];
    lines.forEach(line => {
      if (!line.trim()) return;
      const cols = parseCSVLine(line);
      if (!headerSkipped) { headerSkipped = true; return; }
      if (cols.length >= 2) {
        const cp = cols[0], bp = cols[1];
        if (!bomData[cp]) bomData[cp] = [];
        bomData[cp].push({p: bp, j: cols[2]||'', l: parseInt(cols[3])||0, y: parseInt(cols[4])||1});
        if (!productList.includes(cp)) productList.push(cp);
        if (!(bp in inventory)) inventory[bp] = 0;
      }
    });
    document.getElementById('bomLoadStatus').textContent = '已加载 ' + productList.length + ' 个成品';
    showToast('BOM 数据已加载：' + productList.length + ' 个成品', 'success');
    recalculate();
  };
  reader.readAsText(file, 'UTF-8');
}


function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current.trim());
  return result;
}

// ====== CALCULATION ======
function recalculate() {
  // Recalculate kit availability for each product
  window._dashData = productList.map(cp => {
    const parts = bomData[cp] || [];
    let kitQty = Infinity;
    let shortageParts = [];
    let maxGap = 0;
    
    parts.forEach(part => {
      const stock = inventory[part.p] || 0;
      const need = part.y || 1;
      const gap = need - stock;
      
      if (stock < need) {
        shortageParts.push({name: part.p, stock, need, gap});
        maxGap = Math.max(maxGap, gap);
      }
      kitQty = Math.min(kitQty, Math.floor(stock / need));
    });
    
    if (parts.length === 0) kitQty = 0;
    if (kitQty === Infinity) kitQty = 0;
    
    return {
      cp,
      partCount: parts.length,
      kitQty,
      status: kitQty > 0 ? '可配套' : (shortageParts.length > 0 ? '缺料' : '待备料'),
      shortageCount: shortageParts.length,
      shortageParts,
      maxGap
    };
  });
}

// ====== DASHBOARD ======
function refreshDashboard() {
  recalculate();
  const data = window._dashData || [];
  
  // KPIs
  const total = data.length;
  const kitOk = data.filter(d => d.kitQty > 0).length;
  const kitRate = total > 0 ? ((kitOk / total) * 100).toFixed(1) : 0;
  
  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiKit').textContent = kitOk;
  // 计算库存总数量
  const totalInventory = Object.values(inventory).reduce((sum, qty) => sum + qty, 0);
  document.getElementById('kpiSemiTotal').textContent = totalInventory;
  
  // Table
  renderTable(data);
  
  // Charts
  renderCharts(data);
}

function renderTable(data) {
  const tbody = document.getElementById('dashBody');
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  
  let filtered = data;
  if (search) {
    filtered = data.filter(d => d.cp.toLowerCase().includes(search));
  }
  
  let html = '';
  filtered.forEach((d, idx) => {
    const statusBadge = d.status === '可配套' ? 'badge-green' : (d.status === '缺料' ? 'badge-red' : 'badge-yellow');
    const hasDetail = d.shortageParts.length > 0 || (bomData[d.cp] && bomData[d.cp].length > 0);
    
    html += `<tr class="${hasDetail ? 'expand-row' : ''}" ${hasDetail ? 'onclick="toggleDetail(this)"' : ''}>
      <td><strong>${d.cp}</strong></td>
      <td>${d.partCount}</td>
      <td><strong style="font-size:1.1rem;color:${d.kitQty > 0 ? 'var(--success)' : 'var(--danger)'}">${d.kitQty}</strong></td>
      <td><span class="badge ${statusBadge}">${d.status}</span></td>
      <td>${d.shortageCount > 0 ? '<span style="color:var(--danger)">' + d.shortageCount + ' 种</span>' : '-'}</td>
      <td>${d.maxGap > 0 ? d.maxGap : '-'}</td>
    </tr>`;
    
    if (hasDetail) {
      const parts = bomData[d.cp] || [];
      html += `<tr class="detail-row"><td colspan="6">
        <table style="width:100%;font-size:.84rem">
          <tr style="background:#e8f0fe"><th style="padding:6px 10px">半品料号</th><th style="padding:6px 10px">接头规格</th><th style="padding:6px 10px">需求</th><th style="padding:6px 10px">库存</th><th style="padding:6px 10px">状态</th></tr>
      `;
      parts.forEach(p => {
        const stock = inventory[p.p] || 0;
        const need = p.y || 1;
        let st, cls;
        if (stock >= need) { st = '充足'; cls = 'badge-green'; }
        else if (stock > 0) { st = '低库存'; cls = 'badge-yellow'; }
        else { st = '缺料'; cls = 'badge-red'; }
        html += `<tr>
          <td style="padding:6px 10px;font-family:monospace;font-size:.8rem">${p.p}</td>
          <td style="padding:6px 10px">${p.j || '-'}</td>
          <td style="padding:6px 10px;text-align:center">${need}</td>
          <td style="padding:6px 10px;text-align:center;font-weight:600;${stock < need ? 'color:var(--danger)' : ''}">${stock}</td>
          <td style="padding:6px 10px"><span class="badge ${cls}">${st}</span></td>
        </tr>`;
      });
      html += '</table></td></tr>';
    }
  });
  
  tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-secondary)">暂无数据，请先加载库存 CSV</td></tr>';
}

function toggleDetail(row) {
  row.classList.toggle('open');
  const detail = row.nextElementSibling;
  if (detail && detail.classList.contains('detail-row')) {
    detail.classList.toggle('show');
  }
}

function filterTable() {
  refreshDashboard();
}

let sortAsc = true;
function sortTable() {
  if (!window._dashData) return;
  window._dashData.sort((a, b) => sortAsc ? a.kitQty - b.kitQty : b.kitQty - a.kitQty);
  sortAsc = !sortAsc;
  renderTable(window._dashData);
}

function expandAll() {
  document.querySelectorAll('.expand-row').forEach(r => { r.classList.add('open'); r.nextElementSibling?.classList.add('show'); });
}
function collapseAll() {
  document.querySelectorAll('.expand-row').forEach(r => { r.classList.remove('open'); r.nextElementSibling?.classList.remove('show'); });
}

// ====== CHARTS ======
function renderCharts(data) {
  // Kit distribution chart
  const kitChart = document.getElementById('chartKit');
  const sorted = [...data].sort((a, b) => b.kitQty - a.kitQty).slice(0, 15);
  const maxKit = Math.max(...sorted.map(d => d.kitQty), 1);
  
  kitChart.innerHTML = sorted.map(d => {
    const pct = (d.kitQty / maxKit * 100).toFixed(1);
    const color = d.kitQty > 0 ? 'var(--success)' : 'var(--danger)';
    return `<div class="bar-item">
      <span class="bar-label" title="${d.cp}">${d.cp}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="bar-value">${d.kitQty}</span>
    </div>`;
  }).join('');
  
}

// ====== EXPORT TO EXCEL ======
function exportToExcel() {
  recalculate();
  const data = window._dashData || [];
  
  // 创建工作簿
  const wb = XLSX.utils.book_new();
  
  // Sheet 1: BOM物料清单
  const bomSheetData = [];
  bomSheetData.push(['成品料号', '半品料号', '接头规格', '线长', '单套用量', '备注']);
  Object.keys(bomData).forEach(cp => {
    bomData[cp].forEach(item => {
      bomSheetData.push([cp, item.p, item.j, item.l, item.y, '']);
    });
  });
  const ws1 = XLSX.utils.aoa_to_sheet(bomSheetData);
  XLSX.utils.book_append_sheet(wb, ws1, 'BOM物料清单');
  
  // Sheet 2: 半品库存主数据
  const inventoryData = [];
  inventoryData.push(['所属成品料号', '线序料号', '接头规格', '线长', '单套用量', '累计入库', '累计出库', '当前库存', '库存状态']);
  Object.keys(bomData).forEach(cp => {
    bomData[cp].forEach(item => {
      const qty = inventory[item.p] || 0;
      // 计算累计入库和出库（基于扫码记录）
      let inCount = 0, outCount = 0;
      scanRecords.forEach(r => {
        if (r.c.includes(item.p)) {
          if (r.a === '入库') inCount++;
          else if (r.a === '出库') outCount++;
        }
      });
      const status = qty === 0 ? '缺料' : (qty < 10 ? '低库存' : '正常');
      inventoryData.push([cp, item.p, item.j, item.l, item.y, inCount, outCount, qty, status]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(inventoryData);
  XLSX.utils.book_append_sheet(wb, ws2, '半品库存主数据');
  
  // Sheet 3: 成品齐套看板
  const dashData = [];
  dashData.push(['成品料号', '半品数', '可配套数', '齐套状态', '缺料半品', '缺口数量']);
  data.forEach(d => {
    dashData.push([d.cp, d.partCount, d.kitQty, d.status, d.shortageCount, d.maxGap]);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(dashData);
  XLSX.utils.book_append_sheet(wb, ws3, '成品齐套看板');
  
  // Sheet 4: 扫码区
  const scanData = [];
  scanData.push(['时间', '唯一码', '线序料号', '操作人', '关联单号', '库位', '批次', '动作', '操作人']);
  scanRecords.forEach(r => {
    // 从唯一码中提取线序料号和批次
    const code = r.c;
    const partNum = code.substring(3, 21);
    const batch = code.substring(22, 28);
    scanData.push([r.t, code, partNum, r.r, r.d, r.w, batch, r.a, r.r]);
  });
  const ws4 = XLSX.utils.aoa_to_sheet(scanData);
  XLSX.utils.book_append_sheet(wb, ws4, '扫码区');
  
  // 导出文件
  const now = new Date();
  const dateStr = now.getFullYear() + 
    String(now.getMonth() + 1).padStart(2, '0') + 
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') + 
    String(now.getMinutes()).padStart(2, '0');
  XLSX.writeFile(wb, `半品管理台账_${dateStr}.xlsx`);
  
  showToast('Excel导出成功！');
}

/* ===== 手机摄像头扫码 ===== */
let cameraScanner = null;
let cameraRunning = false;

function openCamera() {
  // 检查浏览器是否支持摄像头
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('当前浏览器不支持摄像头功能，请使用 Chrome / Safari 浏览器');
    return;
  }
  document.getElementById('cameraModal').classList.add('show');
  document.getElementById('cameraStatus').textContent = '正在启动摄像头...';
  startCamera();
}

function closeCamera() {
  stopCamera();
  document.getElementById('cameraModal').classList.remove('show');
}

async function startCamera() {
  if (cameraRunning) return;
  
  try {
    // 优先使用后置摄像头
    const constraints = { 
      video: { 
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    };
    
    cameraScanner = new Html5Qrcode("reader");
    await cameraScanner.start(
      constraints,
      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          return { width: Math.floor(minEdge * 0.85), height: Math.floor(minEdge * 0.35) };
        },
        aspectRatio: 1.0,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      onScanSuccess,
      onScanFailure
    );
    
    cameraRunning = true;
    document.getElementById('cameraStatus').textContent = '将条码对准框内，自动识别';
  } catch (err) {
    console.error('摄像头启动失败:', err);
    document.getElementById('cameraStatus').textContent = '❌ ' + (err.message || '摄像头启动失败');
    // 如果启动失败，清理资源
    if (cameraScanner) {
      try { await cameraScanner.clear(); } catch(e) {}
      cameraScanner = null;
    }
  }
}

async function stopCamera() {
  if (cameraScanner && cameraRunning) {
    try {
      await cameraScanner.stop();
      await cameraScanner.clear();
    } catch(e) { console.warn('停止相机时出错:', e); }
    cameraScanner = null;
    cameraRunning = false;
  }
}

let lastScannedCode = '';
let lastScanTime = 0;

function onScanSuccess(decodedText, decodedResult) {
  const now = Date.now();
  // 防抖：同一个码 3 秒内不重复触发
  if (decodedText === lastScannedCode && now - lastScanTime < 3000) return;
  lastScannedCode = decodedText;
  lastScanTime = now;
  
  // 扫码成功闪一下
  const container = document.querySelector('.camera-container');
  const flash = document.createElement('div');
  flash.className = 'camera-flash';
  container.appendChild(flash);
  setTimeout(() => flash.remove(), 700);
  
  // 更新状态
  document.getElementById('cameraStatus').textContent = '✅ 已识别：' + decodedText.substring(0, 20) + '...';
  
  // 关闭相机，把结果送进 processScan
  stopCamera();
  setTimeout(() => {
    closeCamera();
    processScan(decodedText.trim());
  }, 400);
}

function onScanFailure(error) {
  // 静默忽略 - 每帧没识别到都会触发，不需要处理
}
